version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/docker/**"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/docker/**"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directories:
      - "/docker/**"
    schedule:
      interval: "weekly"
    groups:
      ruby:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
