version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/docker/**"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directories:
      - "/docker/**"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 10

  - package-ecosystem: "bundler"
    directories:
      - "/docker/**"
    schedule:
      interval: "monthly"
    groups:
      ruby:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 10
