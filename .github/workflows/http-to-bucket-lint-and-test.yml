name: Http-to-bucket lint and test
permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/http-to-bucket/**'

defaults:
  run:
    working-directory: docker/http-to-bucket

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: nikeee/setup-pandoc@v1

    # Set up Ruby
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.7'

    # Install dependencies
    - name: Install dependencies
      run: |
        bundle install --jobs 4 --retry 3

    # Run RuboCop
    - name: Run RuboCop
      run: bundle exec rubocop

    # Run RSpec
    - name: Run RSpec tests
      run: bundle exec rspec
